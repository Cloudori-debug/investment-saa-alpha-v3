# 알파 대시보드 — 운영자가 보는 자료 주기 (확인 › ① 숫자)
# 레짐 지표·CECS 수동 채점·주간 AI 제안은 운영 경로가 아님.

version: "0.1"

data_sources:
  fundamentals:
    label: "펀더멘털 (PyKRX/DART)"
    path: data/fundamentals.csv
    as_of_column: report_date
    recommended_days: 90
  sector_mapping:
    label: "섹터 매핑 (KRX)"
    path: data/krx_sector_mapping.csv
    as_of_column: null
    recommended_days: 180
  prices:
    label: "현재가 (PyKRX 종가)"
    path: data/prices.csv
    as_of_column: date
    recommended_days: 1
  t2_events:
    label: "공식 출처 탐색 (RSS)"
    path: data/killswitch_watch.json
    as_of_column: null
    recommended_days: 1
  alpha_scores:
    label: "알파 점수"
    path: alpha_portfolio/data/output/alpha_scores.csv
    as_of_column: as_of
    recommended_days: 7
  qual_rank_overlay:
    label: "신평·공공 게이트 (OpenDART)"
    path: data/qual_rank_overlay.json
    as_of_column: null
    recommended_days: 14
