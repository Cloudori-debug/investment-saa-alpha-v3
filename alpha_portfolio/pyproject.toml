[project]
name = "alpha-portfolio"
version = "0.1.0"
description = "KOSPI alpha screener + exit review (P0 rule-based)"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
data = ["pykrx>=1.0"]
ui = ["streamlit>=1.37"]

[project.scripts]
alpha-screener = "src.main:main"
alpha-collect = "src.collect_main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
