writes_target: false
rebalance: annual_jan
cost_bps_one_way: 15
lookback_calendar_days: 1800
profile: kr_listed_global
notes_ko: >
  국내 상장 ETF로 글로벌 경제 노출(미 국채·달러단기·금). 국고·원화단기를 장기채·현금 대리로 쓰지 않음.
  미국 올인 금지 · Soft=한국 위성 · 밸류만으로 Soft/미국 전량 청산·target 기입 금지.
  S&P 200일 Soft는 2027H2~ 나침반·듀얼 옆 Review(자동주문 없음). 합성·(H)·롤 비용 유의.

