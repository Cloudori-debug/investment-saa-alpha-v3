# Alpha Opportunity Engine v0.2 — general timing layer (shadow pilot only)
schema_version: "0.2"
status: shadow_pilot_only
execution_authority: none
affects_trade_actions: false
affects_final_execution: false

principles:
  - "Opportunity = movement detection, not event-chase"
  - "Catalyst is auxiliary metadata — not a core score pillar"
  - "Pilot max = 25% of target alpha weight per ticker"
  - "Confirmation Engine unchanged"

grade_thresholds:
  e0_max: 39
  e1_max: 54
  e2_max: 69
  e3_max: 84

score_caps:
  volume_max: 20
  price_structure_max: 20
  fundamental_momentum_max: 20
  flow_max: 15
  valuation_rerating_max: 15
  sector_momentum_max: 10
  risk_penalty_max: -30

pilot_fractions:
  e2: 0.10
  e3_min: 0.20
  e3_max: 0.25
  absolute_max: 0.25

stop_rules:
  pct_below_entry: 0.07

volume:
  e3_min_ratio: 3.0
  e2_min_ratio: 1.8
  unusual_min_ratio: 1.5

e3_composite:
  min_signals: 3
  require_volume_for_e3: true

dart_lookback_days: 30
denial_risk_penalty: -12

candidate_sources:
  - positions_kr_alpha
  - alpha_shortlist
  - alpha_candidates_top
  - alpha_portfolio_proposal
  - hakedaka_primary_hunt
  - hakedaka_preliminary_hunt
  - quality_value_top
  - sector_momentum_leaders
  - unusual_volume

max_candidates: 200
quality_value_top_n: 80
sector_leaders_per_sector: 2
unusual_volume_top_n: 40

catalyst_keywords:
  ma_tender: [인수, 합병, 공개매수, M&A, 지분취득]
  buyback: [자사주, 소각, 자기주식]
  major_shareholder: [최대주주, 대주주, major_shareholder]
  activist: [주주제안, 행동주의]
  earnings: [실적, 영업이익, 분기보고서, earnings]
  dividend: [배당, dividend_policy]

denial_keywords: [부인, 사실무근, 해당없음, 해명, rumor, 루머]
